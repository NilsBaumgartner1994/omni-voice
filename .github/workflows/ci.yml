name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: Tests (ohne Modell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check source
          ruff format --check source
      - run: python -m pytest -q
      - name: Alle Python-Dateien kompilieren
        run: python -m compileall -q source/omnivoice_server source/scripts

  compose:
    name: Compose-Dateien prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet

  image:
    name: Image bauen + Smoke-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Platz auf dem Runner schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Image bauen (CPU)
        run: docker build -t omnivoice-docker:cpu source
      - name: Container mit Dummy-Engine starten
        run: |
          docker run -d --name omnivoice-smoke \
            -p 7860:7860 -e OMNIVOICE_ENGINE=dummy \
            omnivoice-docker:cpu
      - name: Smoke-Test
        run: bash source/scripts/smoke_test.sh
      - name: Logs
        if: always()
        run: docker logs omnivoice-smoke || true
