# OmniVoice lokal starten:
#   docker compose up -d --build                                  # CPU (Standard)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#                                                                 # NVIDIA-GPU
#
# Danach: http://localhost:7860
services:
  omnivoice:
    build:
      # Alles zum Bauen des Servers liegt in source/ (Dockerfile, Anwendung,
      # Skripte, Entrypoint). Das Repository-Wurzelverzeichnis bleibt frei fuer
      # Konfiguration (.env) und die Host-Ordner models/ und data/.
      context: ./source
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        OMNIVOICE_VERSION: ${OMNIVOICE_VERSION:-0.2.1}
    image: omnivoice-docker:cpu
    container_name: omnivoice
    ports:
      - "${OMNIVOICE_PORT:-7860}:7860"
    environment:
      OMNIVOICE_MODEL: ${OMNIVOICE_MODEL:-k2-fsa/OmniVoice}
      OMNIVOICE_DEVICE: ${OMNIVOICE_DEVICE:-cpu}
      OMNIVOICE_DTYPE: ${OMNIVOICE_DTYPE:-}
      OMNIVOICE_ENGINE: ${OMNIVOICE_ENGINE:-omnivoice}
      OMNIVOICE_LOAD_ASR: ${OMNIVOICE_LOAD_ASR:-false}
      OMNIVOICE_ASR_MODEL: ${OMNIVOICE_ASR_MODEL:-openai/whisper-large-v3-turbo}
      OMNIVOICE_MAX_TEXT_CHARS: ${OMNIVOICE_MAX_TEXT_CHARS:-2000}
      # Qualität der MP3-Downloads (ffmpeg ist im Image enthalten).
      OMNIVOICE_MP3_BITRATE: ${OMNIVOICE_MP3_BITRATE:-192k}
      # Wo die Personen/Stimmen liegen (im Container-Pfad des Daten-Volumes).
      OMNIVOICE_LIBRARY_DIR: ${OMNIVOICE_LIBRARY_DIR:-/data/voices}
      # Optionaler Hugging-Face-Spiegel, falls huggingface.co blockiert ist.
      # Achtung: hier muss ein echter Standardwert stehen. Ein leerer Wert wird
      # von Compose als gesetztes HF_ENDPOINT="" in den Container gereicht und
      # huggingface_hub baut damit URLs ohne Schema ("UnsupportedProtocol").
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      # Nach `prefetch` auf 1 setzen für vollständig offline Betrieb.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-}
      # Threads für die CPU-Inferenz (leer = alle Kerne).
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-}
    volumes:
      # Beides liegt als normaler Ordner auf dem Host: sichtbar, sicherbar und
      # unabhängig von `docker compose down -v`. Andere Pfade per .env.
      # Modellgewichte (mehrere GB, werden einmal heruntergeladen).
      - ${OMNIVOICE_MODELS_PATH:-./models}:/models
      # Stimm-Bibliothek: Personen, Bilder, Aufnahmen, Texte. Bewusst getrennt
      # von den Gewichten, damit ein Modellwechsel sie nicht anfasst.
      - ${OMNIVOICE_DATA_PATH:-./data}:/data
    restart: unless-stopped
    stop_grace_period: 30s
